version: '3.8'
services:
  minio:
    image: minio/minio
    container_name: minio_storage
    ports:
      - "9000:9000"    # API Port
      - "9001:9001"    # Console Port (Dashboard)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data: